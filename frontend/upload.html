<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Financial Statement — Multi-Agent System</title>
  
  <!-- Inter Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/sidebar.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/cards.css">
  <link rel="stylesheet" href="./css/animations.css">
  
  <style>
    .upload-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--space-6);
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
    }

    .upload-dropzone {
      width: 100%;
      min-height: 250px;
      border: 2px dashed var(--border-medium);
      border-radius: 12px;
      background: var(--bg-card-alt);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      padding: var(--space-4);
      cursor: pointer;
      transition: all var(--transition-fast);
      margin-bottom: var(--space-4);
    }

    .upload-dropzone:hover {
      border-color: var(--accent-blue);
      background: var(--bg-hover);
    }

    .upload-dropzone svg {
      width: 48px;
      height: 48px;
      color: var(--text-secondary);
      opacity: 0.8;
      transition: color var(--transition-fast);
    }

    .upload-dropzone:hover svg {
      color: var(--accent-blue);
      opacity: 1;
    }

    .upload-title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
    }

    .upload-subtitle {
      font-size: var(--font-size-sm);
      color: var(--text-muted);
    }

    .file-input {
      display: none;
    }

    .form-group {
      width: 100%;
      text-align: left;
      margin-bottom: var(--space-3);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-input {
      width: 100%;
      height: 38px;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: 6px;
      padding: 0 var(--space-3);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      outline: none;
      transition: border-color var(--transition-fast);
    }

    .form-input:focus {
      border-color: var(--accent-blue);
    }

    .upload-progress-container {
      width: 100%;
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      display: none;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-3);
      text-align: left;
    }

    .progress-bar-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-blue);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar navigation placeholder (Simulated with simple HTML in static view) -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg class="lucide lucide-trending-up" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
        </div>
        <div class="sidebar-logo-text">
          <span class="logo-title">Multi-Agent</span>
          <span class="logo-subtitle">Financial Statement Analysis</span>
        </div>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-section-label">Navigation</span>
          <a href="./index.html" class="nav-item">
            <svg class="lucide lucide-layout-dashboard" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="7" height="9" x="3" y="3" rx="1"/>
              <rect width="7" height="5" x="14" y="3" rx="1"/>
              <rect width="7" height="9" x="14" y="10" rx="1"/>
              <rect width="7" height="5" x="3" y="16" rx="1"/>
            </svg>
            <span class="nav-item-label">Dashboard</span>
          </a>
          <a href="#" class="nav-item active">
            <svg class="lucide lucide-upload-cloud" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
              <path d="M12 12v9"/>
              <path d="m16 16-4-4-4 4"/>
            </svg>
            <span class="nav-item-label">Upload Report</span>
          </a>
        </div>
      </div>
      <div class="sidebar-footer">
        <span class="sidebar-footer-text">© 2025 Multi-Agent AI System</span>
      </div>
    </aside>
    
    <!-- Main Ingestion Area -->
    <main class="main-content">
      <header class="header">
        <div class="header-row-1">
          <div class="header-company-info">
            <h1 class="header-company-name">Upload Financial Document</h1>
          </div>
        </div>
      </header>

      <div class="dashboard-scroll">
        <div class="card upload-container animate-fade-in stagger-1">
          
          <form id="upload-form" style="width: 100%;">
            <!-- Drag and drop zone -->
            <label class="upload-dropzone" id="dropzone">
              <input type="file" class="file-input" id="file-selector" accept=".pdf" required />
              <svg class="lucide lucide-upload-cloud" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
                <path d="M12 12v9"/>
                <path d="m16 16-4-4-4 4"/>
              </svg>
              <span class="upload-title" id="dropzone-text">Drag & Drop Financial Statement PDF</span>
              <span class="upload-subtitle">Accepts native and scanned annual reports (Max 50MB)</span>
            </label>

            <!-- Ticker Details metadata fields -->
            <div class="form-group">
              <label class="field-label" for="company-name-input">Company Name</label>
              <input type="text" class="form-input" id="company-name-input" placeholder="e.g. Apollo Hospitals" required />
            </div>

            <div class="form-group">
              <label class="field-label" for="ticker-input">Ticker Symbol</label>
              <input type="text" class="form-input" id="ticker-input" placeholder="e.g. APOLLOHOSP" required />
            </div>

            <button type="submit" class="btn btn-filled w-full" style="height: 40px; margin-top: var(--space-3);" id="btn-submit">
              Analyze Financial Document
            </button>
          </form>

          <!-- Upload and analysis progress indicator -->
          <div class="upload-progress-container" id="progress-container">
            <div style="display: flex; justify-content: space-between; font-size: var(--font-size-base);">
              <span id="progress-status-label" class="font-medium">Uploading document...</span>
              <span id="progress-percent-label" class="font-semibold">0%</span>
            </div>
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <span class="upload-subtitle" style="margin-top: 4px;" id="progress-sub-text">Injesting files...</span>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script src="./js/upload.js"></script>
</body>
</html>
