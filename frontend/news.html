<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market News & Sentiment — Multi-Agent System</title>
  
  <!-- Inter Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/sidebar.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/cards.css">
  <link rel="stylesheet" href="./css/table.css">
  <link rel="stylesheet" href="./css/responsive.css">
  
  <style>
    .news-dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 24px;
      margin-bottom: 32px;
    }
    .col-12 { grid-column: span 12; }
    .col-8 { grid-column: span 8; }
    .col-4 { grid-column: span 4; }
    
    @media (max-width: 992px) {
      .col-8, .col-4 { grid-column: span 12; }
    }

    .news-control-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-articles-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .news-card-item {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .news-card-item:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.08);
    }

    .news-headline-link {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      line-height: 1.4;
    }
    .news-headline-link:hover {
      color: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar navigation -->
    <aside id="sidebar-container" class="sidebar"></aside>
    
    <!-- Main content viewport -->
    <main class="main-content">
      <div style="display: flex; flex-direction: column; flex: 1; overflow: hidden; height: 100%;">
        
        <!-- Header -->
        <header id="header-container" class="header"></header>
        
        <!-- Scrollable content -->
        <div class="dashboard-scroll" style="padding: 32px;">
          
          <div class="news-dashboard-grid">
            
            <!-- Controls & Overview Side Panel -->
            <div class="col-4">
              <div class="news-control-card">
                <div class="card-title" style="margin-bottom: 0;">Sentiment Indicator</div>
                
                <div id="sentiment-overview-container" style="background: var(--bg-card-alt); border: 1px solid var(--border-subtle); padding: 16px; border-radius: var(--radius-sm); text-align: center; display: flex; flex-direction: column; gap: 8px;">
                  <span style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Overall Sentiment</span>
                  <span id="overall-sentiment-badge" class="badge badge-neutral" style="font-size: 16px; padding: 6px 12px; align-self: center;">NEUTRAL</span>
                  <span id="sentiment-score-val" style="font-size: 32px; font-weight: 700; color: var(--text-primary); margin-top: 8px;">--/100</span>
                  <span style="font-size: 11px; color: var(--text-muted);">Weighted News Index Score</span>
                </div>

                <div class="card-title" style="margin-bottom: 0; margin-top: var(--space-3);">Search & Filter Feed</div>
                <input type="text" id="news-search-input" placeholder="Search news headlines..." style="width: 100%; font-size: 13px; background: var(--bg-card-alt); border: 1px solid var(--border-subtle); padding: 10px 14px; border-radius: 4px; color: var(--text-primary); outline: none;">
                
                <div class="filter-btn-group" style="display: flex; flex-direction: column; gap: var(--space-2);">
                  <button class="btn btn-outline active" data-filter="All" style="text-align: left; justify-content: space-between; display: flex; align-items: center; width: 100%;">
                    <span>All Articles</span>
                    <span id="count-all" class="badge badge-neutral" style="font-size: 9px; padding: 1px 5px;">0</span>
                  </button>
                  <button class="btn btn-outline" data-filter="Positive" style="text-align: left; justify-content: space-between; display: flex; align-items: center; width: 100%; color: var(--accent-green); border-color: rgba(56, 161, 105, 0.2);">
                    <span>Positive Sentiment</span>
                    <span id="count-pos" class="badge badge-positive" style="font-size: 9px; padding: 1px 5px;">0</span>
                  </button>
                  <button class="btn btn-outline" data-filter="Neutral" style="text-align: left; justify-content: space-between; display: flex; align-items: center; width: 100%;">
                    <span>Neutral Sentiment</span>
                    <span id="count-neu" class="badge badge-neutral" style="font-size: 9px; padding: 1px 5px;">0</span>
                  </button>
                  <button class="btn btn-outline" data-filter="Negative" style="text-align: left; justify-content: space-between; display: flex; align-items: center; width: 100%; color: var(--accent-red); border-color: rgba(229, 62, 62, 0.2);">
                    <span>Negative Sentiment</span>
                    <span id="count-neg" class="badge badge-negative" style="font-size: 9px; padding: 1px 5px;">0</span>
                  </button>
                </div>

                <button id="news-refresh-btn" class="btn btn-filled" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: var(--space-2);">
                  <svg class="lucide lucide-refresh-cw" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 13px; height: 13px;"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                  Refresh News Feed
                </button>
              </div>
            </div>

            <!-- Articles Feed List -->
            <div class="col-8">
              <div class="news-articles-card">
                <div class="card-title" style="margin-bottom: 0; display: flex; justify-content: space-between; align-items: center;">
                  <span>Latest Regulatory & Sector News</span>
                  <span id="news-status-label" style="font-size: 11px; font-weight: normal; color: var(--text-muted);">Up-to-date</span>
                </div>
                
                <div id="articles-feed-container" style="display: flex; flex-direction: column; gap: var(--space-3.5);">
                  <!-- Populated dynamically -->
                </div>
              </div>
            </div>
            
          </div>

        </div>
      </div>
    </main>
    
  </div>

  <script type="module" src="./js/news.js"></script>
</body>
</html>
