<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Report Assistant — Ask AI</title>
  
  <!-- Inter Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/sidebar.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/chat.css">
  
  <style>
    .ask-ai-viewport {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 70px);
      position: relative;
      overflow: hidden;
    }

    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 32px;
      max-width: 680px;
      margin: auto;
      gap: 24px;
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .welcome-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .suggested-prompts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-top: 16px;
    }

    @media (max-width: 576px) {
      .suggested-prompts-grid {
        grid-template-columns: 1fr;
      }
    }

    .prompt-card {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      text-align: left;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .prompt-card:hover {
      background: var(--bg-hover);
      border-color: var(--accent-blue);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    /* Message Thread viewport (Fix Chat Layout constraint) */
    .convo-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 100%;
      margin: 0;
      box-sizing: border-box;
    }

    /* Assistant Message Bubble */
    .bubble-assistant {
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      min-width: 320px;
      max-width: 65%;
      width: fit-content;
      height: auto;
      padding: 12px 16px;
      border-radius: 16px;
      border-bottom-left-radius: 2px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap;
      line-height: 1.5;
      margin-bottom: 0;
      box-sizing: border-box;
    }

    /* User Message Bubble */
    .bubble-user {
      align-self: flex-end;
      background: var(--accent-blue);
      color: #ffffff;
      max-width: 40%;
      width: fit-content;
      height: auto;
      padding: 12px 16px;
      border-radius: 16px;
      border-bottom-right-radius: 2px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap;
      margin-bottom: 0;
      box-sizing: border-box;
    }

    /* Responsive dimensions rules */
    @media (max-width: 768px) {
      .bubble-assistant {
        max-width: 85%;
        min-width: 280px;
      }
      .bubble-user {
        max-width: 70%;
      }
    }

    @media (max-width: 480px) {
      .bubble-assistant {
        max-width: 90%;
        min-width: 240px;
      }
      .bubble-user {
        max-width: 80%;
      }
    }

    /* Bottom sticky bar input container */
    .sticky-chat-bar {
      position: sticky;
      bottom: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: 24px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15);
      max-width: 760px;
      width: calc(100% - 64px);
      margin: 0 auto 24px auto;
      z-index: 10;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .sticky-bar-input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      resize: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      line-height: 1.4;
      height: 24px;
      max-height: 120px;
    }

    .icon-btn-disabled {
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.4;
    }

    .chat-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 4px;
      margin-top: 4px;
    }

    .badge-status {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar navigation -->
    <aside id="sidebar-container" class="sidebar"></aside>
    
    <!-- Main content viewport -->
    <main class="main-content">
      <div style="display: flex; flex-direction: column; flex: 1; overflow: hidden; height: 100%;">
        
        <!-- Header -->
        <header id="header-container" class="header"></header>
        
        <!-- Viewport Container -->
        <div class="ask-ai-viewport">
          
          <!-- Centered Welcome Screen -->
          <div class="welcome-screen" id="chat-welcome-screen">
            <div class="welcome-title">Financial Report Assistant</div>
            <div class="welcome-subtitle" id="welcome-subtitle-text">
              Ask anything about the uploaded financial report.
            </div>
            
            <div class="suggested-prompts-grid" id="welcome-prompts-grid">
              <div class="prompt-card" data-prompt="Summarize this report">Summarize Report</div>
              <div class="prompt-card" data-prompt="What are the key risks?">Show Risks</div>
              <div class="prompt-card" data-prompt="Explain Revenue">Explain Revenue</div>
              <div class="prompt-card" data-prompt="Why is Recommendation BUY?">Explain Recommendation</div>
              <div class="prompt-card" data-prompt="Compare with competitors">Compare Competitors</div>
            </div>
          </div>

          <!-- Dynamic Chat Thread Area -->
          <div class="convo-container" id="chat-conversation-view" style="display: none;">
            <!-- Message bubbles appended here -->
          </div>

          <!-- ChatGPT Bottom Sticky Bar -->
          <div class="sticky-chat-bar">
            <div class="sticky-bar-input-row">
              <!-- Disabled Paperclip Icon -->
              <button class="icon-btn-disabled" type="button" title="Upload attachments (disabled)" style="background:none; border:none; display:flex; align-items:center;">
                <svg class="lucide lucide-paperclip" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </button>

              <textarea 
                id="ask-chat-textarea" 
                placeholder="Ask the Financial Assistant..." 
                rows="1"
                class="chat-textarea"
              ></textarea>

              <!-- Send Button -->
              <button id="btn-ask-send" class="btn btn-filled" style="padding: 6px 12px; border-radius: 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <svg class="lucide lucide-arrow-up" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><line x1="12" x2="12" y1="19" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                Send
              </button>
            </div>

            <!-- Meta details row under input -->
            <div class="chat-meta-bar">
              <div>
                PDF: <span id="chat-pdf-badge" class="badge-status" style="background:rgba(229, 62, 62,0.1); color:var(--accent-red);">Not Loaded</span>
                <span id="chat-company-indicator" style="margin-left: 8px; font-weight: 500;"></span>
              </div>
              <div style="display: flex; gap: 12px; align-items: center;">
                <span id="chat-history-count">0 turns</span>
                <span style="cursor: pointer; color: var(--accent-red); font-weight: 500;" id="btn-chat-reset-action">Clear Chat</span>
              </div>
            </div>
          </div>

        </div>

      </div>
    </main>
    
  </div>

  <script type="module" src="./js/ask_ai.js"></script>
</body>
</html>
